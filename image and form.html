<!DOCTYPE html>
<html>
    <head>
        <title> Registration form </title>
        <link rel="stylesheet" href="sheets/Form.css">
        <link rel="icon" href="Image/Diamond_Sword_25716.png">
    </head>

    <body>

        <form action="https://httpbin.org/get" method="get" class="form-container">
            <h2 class="form-title">Registration Form</h2>

            <div class="form">
                <label for="firstname">First Name</label>
                <input type="text" id="firstname" name="firstname" placeholder="Jane" autofocus required class="input-field">
            </div>

            <div class="form">
                <label for="lastname">Last Name</label>
                <input type="text" id="lastname" name="lastname" placeholder="gery" required class="input-field">
            </div>

            <div class="form">
                <label for="email"> Email </label>
                <input type="text" id="email" name="email" placeholder="janegery@gmail.com" 
                       pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" class="input-field">
            </div>

            <div class="form">
                <label for="message">Message</label>
                <textarea name="message" id="message" cols="40" rows="10" placeholder="write something" class="input-field"></textarea>
            </div>

            <div class="form">
                <label for="number">Batch Number</label>
                <input type="number" id="number" name="number" min="10" max="50" step="10" value="30" class="input-field">
            </div>

            <div class="form">
                <p class="form-label">Tools Known</p>
                <input type="checkbox" name="tools-known" id="HTML" value="HTML" class="checkbox">
                <label for="HTML">HTML</label>
                <input type="checkbox" name="tools-known" id="CSS" value="CSS" class="checkbox">
                <label for="CSS">CSS</label>
                <input type="checkbox" name="tools-known" id="JS" value="JS" class="checkbox">
                <label for="JS">JavaScript</label>
            </div>

            <div class="form">
                <p class="form-label">Framework</p>
                <input type="radio" name="Framework" id="node.js" value="node" class="radio">
                <label for="node.js">Node Js</label>
                <input type="radio" name="Framework" id="react.js" value="react" class="radio">
                <label for="react.js">React js</label>
                <input type="radio" name="Framework" id="angular.js" value="angular" class="radio">
                <label for="angular.js">Angular</label>
            </div>

            <div class="form">
                <label for="stack">Choose your Stack</label>
                <select name="stack" id="stack" class="input-field">
                    <option value="AIML">AIML</option>
                    <option value="Python" selected>Python</option>
                    <option value="Java">Java</option>
                </select>
            </div>
            <!--
            <div>
                <label for="stack" > Choose your stack</label>
                <input type="text" id="stack" name="Stack" list="stack-list">

                <datalist>
                    <option value="AIML">
                    <option value="FSD">
                    <option value="DA">
                </datalist>
            </div> -->

            <button type="submit" class="submit-btn">Submit</button>
        </form>

    </body>
</html>
